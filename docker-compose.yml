version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=SmartCart AI - Autonomous Retail Backend
      - SECRET_KEY=smartcart-super-secret-key-change-in-production-2026
      - CONFIDENCE_HIGH=0.85
      - CONFIDENCE_MEDIUM=0.65
      - CONFIDENCE_LOW=0.50
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/smartcart.db:/app/smartcart.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
